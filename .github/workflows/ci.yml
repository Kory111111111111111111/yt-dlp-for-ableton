name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Runs for everyone (including fork PRs). No Ableton SDK required.
  test:
    name: test (public)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ThirdAbletonProject
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (URL parsing)
        run: npx --yes tsx@4.19.0 --test tests/**/*.test.ts

      - name: Lockfile audit
        run: npm audit --package-lock-only --audit-level=high

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Maintainer only: ABLETON_EXTENSIONS_PAT + private AbletonExtensions checkout.
  # Not run for pull requests from forks.
  build:
    name: build (maintainer)
    runs-on: ubuntu-latest
    if: >-
      secrets.ABLETON_EXTENSIONS_PAT != '' &&
      github.repository == 'Kory111111111111111111/yt-dlp-for-ableton' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: ThirdAbletonProject
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ableton SDK
        uses: ./.github/actions/setup-ableton-sdk
        with:
          token: ${{ secrets.ABLETON_EXTENSIONS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ThirdAbletonProject/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: npm audit (installed tree)
        run: npm audit --audit-level=high

  codeql:
    name: codeql (maintainer)
    runs-on: ubuntu-latest
    if: >-
      secrets.ABLETON_EXTENSIONS_PAT != '' &&
      github.repository == 'Kory111111111111111111/yt-dlp-for-ableton' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ableton SDK
        uses: ./.github/actions/setup-ableton-sdk
        with:
          token: ${{ secrets.ABLETON_EXTENSIONS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ThirdAbletonProject
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

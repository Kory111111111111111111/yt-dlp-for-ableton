version: 2

updates:
  - package-ecosystem: npm
    directory: /ThirdAbletonProject
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "@types/*"
          - "esbuild"
          - "tsx"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

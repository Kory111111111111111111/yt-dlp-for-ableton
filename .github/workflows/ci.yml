name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: ThirdAbletonProject

env:
  ABLETON_EXTENSIONS_REPO: Kory111111111111111111/AbletonExtensions
  ABLETON_SDK_VERSION: extensions-sdk-1.0.0-beta.0

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout Ableton Extensions SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ABLETON_EXTENSIONS_REPO }}
          path: .sdk-source
          sparse-checkout: ${{ env.ABLETON_SDK_VERSION }}

      - name: Sync SDK into vendor/
        run: node scripts/sync-sdk.mjs
        env:
          ABLETON_SDK_DIR: ${{ github.workspace }}/.sdk-source/${{ env.ABLETON_SDK_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ThirdAbletonProject/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SDK (for lockfile integrity)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ABLETON_EXTENSIONS_REPO }}
          path: .sdk-source
          sparse-checkout: ${{ env.ABLETON_SDK_VERSION }}

      - name: Sync SDK into vendor/
        working-directory: ThirdAbletonProject
        run: node scripts/sync-sdk.mjs
        env:
          ABLETON_SDK_DIR: ${{ github.workspace }}/.sdk-source/${{ env.ABLETON_SDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ThirdAbletonProject/package-lock.json

      - name: Install dependencies
        working-directory: ThirdAbletonProject
        run: npm ci

      - name: Audit production dependencies
        working-directory: ThirdAbletonProject
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        working-directory: ThirdAbletonProject
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ABLETON_EXTENSIONS_REPO }}
          path: .sdk-source
          sparse-checkout: ${{ env.ABLETON_SDK_VERSION }}

      - name: Sync SDK into vendor/
        working-directory: ThirdAbletonProject
        run: node scripts/sync-sdk.mjs
        env:
          ABLETON_SDK_DIR: ${{ github.workspace }}/.sdk-source/${{ env.ABLETON_SDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ThirdAbletonProject
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

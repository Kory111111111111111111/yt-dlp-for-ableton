name: Setup Ableton Extensions SDK
description: Maintainer CI — fetch SDK packages into ThirdAbletonProject/vendor/

inputs:
  token:
    description: Repository secret ABLETON_EXTENSIONS_PAT
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout SDK packages (maintainer)
      uses: actions/checkout@v4
      with:
        repository: Kory111111111111111111/AbletonExtensions
        path: .sdk-source
        token: ${{ inputs.token }}
        fetch-depth: 1
        sparse-checkout: |
          extensions-sdk-1.0.0-beta.0

    - name: Sync SDK into vendor/
      shell: bash
      working-directory: ThirdAbletonProject
      run: node scripts/sync-sdk.mjs
      env:
        ABLETON_SDK_DIR: ${{ github.workspace }}/.sdk-source/extensions-sdk-1.0.0-beta.0

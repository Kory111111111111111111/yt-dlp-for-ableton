name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build .ablx release asset
    runs-on: ubuntu-latest
    if: secrets.ABLETON_EXTENSIONS_PAT != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ableton SDK
        uses: ./.github/actions/setup-ableton-sdk
        with:
          token: ${{ secrets.ABLETON_EXTENSIONS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ThirdAbletonProject/package-lock.json

      - name: Install dependencies
        working-directory: ThirdAbletonProject
        run: npm ci

      - name: Package extension
        working-directory: ThirdAbletonProject
        run: npm run package

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ThirdAbletonProject/dist/YouTubeToProject.ablx
          generate_release_notes: true

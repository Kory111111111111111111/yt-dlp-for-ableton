<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Import from YouTube</title>
  <script>
    (function () {
      var live = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live;
      var wv2 = window.chrome && window.chrome.webview;
      function send(msg) {
        if (live) live.postMessage(msg);
        else if (wv2) wv2.postMessage(msg);
      }
      function closeWithResult(result) {
        send({ method: "close_and_send", params: [JSON.stringify(result)] });
      }
      window.__initYoutubeDialog = function () {
        var input = document.getElementById("url");
        document.getElementById("btn-import").onclick = function () {
          closeWithResult({ url: input.value, canceled: false });
        };
        document.getElementById("btn-cancel").onclick = function () {
          closeWithResult({ canceled: true });
        };
        input.focus();
        document.onkeydown = function (e) {
          if (e.key === "Enter") document.getElementById("btn-import").click();
          if (e.key === "Escape") document.getElementById("btn-cancel").click();
        };
      };
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      background: #363636;
      color: #b5b5b5;
      font: 500 11.5px "AbletonSansSmall", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .title { color: #ff9f43; font-size: 12px; }
    .hint { line-height: 1.45; color: #8a8a8a; font-size: 11px; }
    .alx-input {
      width: 100%;
      height: 22px;
      padding: 0 8px;
      border: 1px solid #121212;
      background: #1e1e1e;
      color: #b5b5b5;
      outline: none;
    }
    .alx-input:focus { outline: 2px solid #6a6a6a; }
    .spacer { flex: 1; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .actions button {
      height: 22px;
      padding: 0 14px;
      border: 1px solid #121212;
      border-radius: 11px;
      background: #2a2a2a;
      color: #b5b5b5;
      cursor: pointer;
    }
    .actions button.primary {
      background: #ff9f43;
      color: #121212;
    }
  </style>
</head>
<body onload="window.__initYoutubeDialog()">
  <div class="title">Import from YouTube</div>
  <p class="hint">Paste a video link. Audio is downloaded as MP3 and added to your project. Requires yt-dlp and ffmpeg on PATH.</p>
  <input class="alx-input" type="text" id="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
  <div class="spacer"></div>
  <div class="actions">
    <button type="button" id="btn-cancel">Cancel</button>
    <button type="button" class="primary" id="btn-import">Import</button>
  </div>
</body>
</html>
